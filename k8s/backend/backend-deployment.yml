apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-deployment
  template:
    metadata:
      labels:
        app: backend-deployment
    spec:
      containers:
      - name: backend-container
        image: samidha7/student-management-system-docker-3-tier-application-backend:v3
        imagePullPolicy: Always
        
        envFrom:
        - configMapRef:
            name: mysql-config 
        - secretRef:
            name: mysql-secret    

        ports:
        - containerPort: 5000
