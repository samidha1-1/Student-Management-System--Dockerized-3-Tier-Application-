apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-deployment
  template:
    metadata:
      labels:
        app: frontend-deployment 
    spec:
      containers:
      - name:  frontend-container
        image: samidha7/student-management-system-docker-3-tier-application-frontend
        imagePullPolicy: Always
        ports:
        - containerPort: 80
